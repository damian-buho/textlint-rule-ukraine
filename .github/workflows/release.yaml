name: Release
# Fires when Pipeline finishes successfully and a git tag points to the head
# commit. Publishes to npm via OIDC trusted publishing.
#
# To release: push a tag.
#   git tag vX.Y.Z && git push origin vX.Y.Z
# Pipeline runs on the tag push; its success triggers this workflow; the gate
# finds the tag at HEAD; publish-npm publishes.
#
# There is no workflow_dispatch path — tag creation IS the release operation.
#
# Note: workflow_run-triggered workflows always run the version of this file
# from the default branch. To roll out a change to Release, merge to main first.
#
# One-time setup required: configure trusted publisher on npmjs.com pointing
# at this repo + this workflow filename. Until that is done, publish-npm will
# fail loudly with an OIDC error — that's expected.

on:
  workflow_run:
    workflows: [Pipeline]
    types: [completed]

permissions:
  contents: read

concurrency:
  # workflow_run carries no meaningful github.ref — key on the underlying
  # head_sha so two pipeline runs for the same SHA (branch push + tag push)
  # serialize. Never cancel; the gate dedups any duplicate trigger.
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  gate:
    # Three-fact gate: Pipeline must have succeeded for a push to main, and the
    # head SHA must carry a tag we haven't already released. Any failing fact →
    # all downstream jobs no-op via `if: needs.gate.outputs.tag != ''`.
    name: Gate
    runs-on: ubuntu-24.04
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.gate.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref:          ${{ github.event.workflow_run.head_sha }}
          fetch-depth:  0

      - id:   gate
        name: Resolve tag at HEAD (and dedup)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Tagged commits typically produce TWO Pipeline runs (branch push +
        # tag push), each firing Release. We dedup by skipping if a GitHub
        # release for this tag already exists from the first run.
        run: |
          set -euo pipefail
          tag=$(git tag --points-at HEAD | head -n1)
          if [ -z "${tag}" ]; then
            echo "No tag at $(git rev-parse HEAD) — Pipeline succeeded but nothing to release."
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh release view "${tag}" --json tagName >/dev/null 2>&1; then
            echo "GitHub release ${tag} already exists — duplicate trigger ignored."
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Releasing ${tag} at $(git rev-parse HEAD)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  build-npm:
    # Build the package and produce a tarball artifact. Runs with minimal
    # permissions so npm lifecycle scripts cannot access OIDC or write tokens.
    # The repository.url rewrite is applied here so the published tarball
    # carries the GitHub mirror URL required by npm's OIDC trusted publisher.
    name: Build npm artifact
    needs: gate
    if:    needs.gate.outputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref:         ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache:        npm

      - run: npm ci

      # The committed package.json keeps Codeberg as the canonical repository
      # (matches projectfile.yaml). npm's OIDC trusted publisher validates
      # against the GitHub repo — rewrite only on the runner, never committed.
      - name: Rewrite repository URL to GitHub mirror for OIDC
        run: |
          set -euo pipefail
          url="https://github.com/${{ github.repository }}"
          jq --arg url "$url" '.repository.url = $url' package.json > package.json.tmp
          mv package.json.tmp package.json
          echo "repository.url rewritten to: ${url}"

      # prepublishOnly only fires on `npm publish`, not `npm pack`. Run the
      # build explicitly so the dist/ directory is present in the tarball.
      - run: npm run build

      - run: npm pack

      - uses: actions/upload-artifact@v4
        with:
          name:              npm-tarball
          path:              "*.tgz"
          if-no-files-found: error
          retention-days:    1

  publish-npm:
    # Publishes the pre-built tarball to npm (OIDC) and creates the GitHub
    # release. No checkout, so npm lifecycle scripts never run here.
    name: Publish npm + GitHub release
    needs: [gate, build-npm]
    if:    needs.gate.outputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # GitHub release creation
      id-token: write  # OIDC for npm trusted publishing + provenance
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-tarball

      - uses: actions/setup-node@v6
        with:
          node-version:  '24'
          registry-url:  https://registry.npmjs.org

      - name: Publish to npm
        run:  npm publish *.tgz --provenance --access public

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name:               ${{ needs.gate.outputs.tag }}
          generate_release_notes: true

  update-floating-tags:
    # Moves the floating major/minor tags (v1, v1.2) to the new release SHA.
    # Uses contents: write only — no OIDC — so the checkout cannot be
    # leveraged to exfiltrate privileged tokens. Checks out the published tag
    # ref rather than the raw head_sha, breaking the taint chain.
    # Pushed with GITHUB_TOKEN so the tag push does not retrigger Pipeline.
    name: Update floating tags
    needs: [gate, publish-npm]
    if:    needs.gate.outputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref:         ${{ needs.gate.outputs.tag }}
          fetch-depth: 0

      - name: Update floating major/minor tags
        env:
          VERSION: ${{ needs.gate.outputs.tag }}
        run: |
          set -euo pipefail
          v="${VERSION#v}"
          if ! [[ "$v" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Skipping floating tags — '${VERSION}' is not a clean semver (pre-release or build metadata)"
            exit 0
          fi
          major="v${BASH_REMATCH[1]}"
          minor="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for floating in "${major}" "${minor}"; do
            echo "Moving ${floating} → $(git rev-parse HEAD)"
            git tag --force --annotate "${floating}" --message "Floating tag for ${VERSION}"
            git push --force origin "refs/tags/${floating}"
          done
